<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="900" height="380" fill="#ffffff"/><text x="30.0" y="40.0" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#141414" text-anchor="start" font-weight="400">What the model has to notice, and what it does not</text><text x="30.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#565d66" text-anchor="start" font-weight="400">Screen displacement of the turtle, in pixels, from one turn to the next.</text><text x="196.0" y="114.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#141414" text-anchor="end" font-weight="400">its own move</text><rect x="210.0" y="96.0" width="43.3" height="24.0" rx="4" fill="#1f5fa8" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="263.3" y="114.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1f5fa8" text-anchor="start" font-weight="500">39 px</text><text x="196.0" y="160.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#141414" text-anchor="end" font-weight="400">15° rotation</text><rect x="210.0" y="142.0" width="48.0" height="24.0" rx="4" fill="#b3261e" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="268.0" y="160.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b3261e" text-anchor="start" font-weight="500">44 px</text><text x="196.0" y="206.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#141414" text-anchor="end" font-weight="400">45° rotation</text><rect x="210.0" y="188.0" width="152.9" height="24.0" rx="4" fill="#b3261e" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="372.9" y="206.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b3261e" text-anchor="start" font-weight="500">139 px</text><text x="196.0" y="252.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#141414" text-anchor="end" font-weight="400">90° rotation</text><rect x="210.0" y="234.0" width="371.6" height="24.0" rx="4" fill="#b3261e" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="591.6" y="252.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b3261e" text-anchor="start" font-weight="500">339 px</text><text x="196.0" y="298.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#141414" text-anchor="end" font-weight="400">180° rotation</text><rect x="210.0" y="280.0" width="560.0" height="24.0" rx="4" fill="#b3261e" stroke="none" stroke-width="1" fill-opacity="0.85"/><text x="780.0" y="298.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b3261e" text-anchor="start" font-weight="500">510 px</text><line x1="210.0" y1="86.0" x2="210.0" y2="308.0" stroke="#e3e6ea" stroke-width="1"/><text x="30.0" y="340.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#565d66" text-anchor="start" font-weight="400">The turtle's own step is the small change. The rotation is the large one, and it carries no information about what to do next.</text><text x="30.0" y="360.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#878e97" text-anchor="start" font-weight="400">That asymmetry is the whole hypothesis, and it is worth testing.</text></svg>