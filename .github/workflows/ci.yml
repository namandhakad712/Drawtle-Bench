name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  platform:
    name: typecheck / lint / tests (67 tests, parity proofs included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bunx tsc --noEmit
      - name: lint
        run: bunx biome check .
      - name: tests (core + harness parity, e2e, floor gate, levels)
        run: bun test packages --timeout 60000
      - name: levels manifest drift gate (difficulty labels match the dataset)
        run: bun packages/cli/src/index.ts levels --check
      - name: self-check (6 gates - ceiling, floor, MDI, semantics, invariance, level separation)
        run: bun packages/cli/src/index.ts self-check
      - name: doctor must be READY
        run: bun packages/cli/src/index.ts doctor

  parity:
    name: golden fixtures still match the frozen v2 reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Regenerates every fixture from legacy/python-v2 into a temp dir and
      # diffs against the committed copies; also re-measures the reference
      # properties and refuses drift in results/. Exits non-zero on any
      # difference, so the parity fixtures and the published MDI can never
      # go stale silently (the exact failure this branch found in v2).
      - name: regenerate and diff
        run: python3 tools/parity/generate_golden.py --check

  board:
    name: control centre smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: serve and probe
        run: |
          bun packages/board/src/server.ts --port 8123 --no-open &
          sleep 2
          set -e
          for u in / /theme.css /vendor/preact.js /vendor/htm.js /app/main.tsx \
                   /api/v3/system /api/v3/leaderboard /api/v3/runs /api/v3/analytics \
                   /api/v3/levels "/api/v3/leaderboard?level=diamond" /api/v3/registry \
                   /api/v3/integrity /api/v3/vision-probe; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8123$u")
            echo "$u -> $code"
            [ "$code" = "200" ] || exit 1
          done
          # a 404 must be a 404; a bad level selector must be a 400
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8123/api/v3/nope")
          [ "$code" = "404" ] || exit 1
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8123/api/v3/leaderboard?level=bogus")
          [ "$code" = "400" ] || exit 1
