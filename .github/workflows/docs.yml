name: docs

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The docs build is intentionally dependency-free, so there is nothing to
      # install. If this step ever needs a pip install, that is a regression.
      #
      # The figures cannot be regenerated here without a browser, but their SVG
      # source can be: it is pure Python. Regenerating it proves the committed
      # figures still match the engine, which is the only way the images can
      # drift. The PNGs are committed alongside and are checked for presence.
      - name: Regenerate figure sources
        run: python docs/make_images.py --no-raster

      - name: Assert the committed figures still match the engine
        run: git diff --exit-code -- docs/assets/img || {
               echo '::error::docs/assets/img is out of date — run python docs/make_images.py and commit the result'; exit 1; }

      - name: Build the site
        run: python docs/build.py

      - name: Lint the built site
        run: python docs/lint.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
